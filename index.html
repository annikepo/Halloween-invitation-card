<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halloween Party Invitation</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

  <main class="invitation-container">
    <div id="envelopeCard" class="envelope-card state-closed">
    
      <img src="images/1.svg" class="env-img img-closed" alt="Closed Envelope">
      <img src="images/2.svg" class="env-img img-opening" alt="Opening Envelope">
      <img src="images/3.svg" class="env-img img-open" alt="Opened Invitation">
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
